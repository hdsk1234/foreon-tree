  // src/engine/treeDesign.mjs

  // src/engine/ParticleScene.ts

  function createParticleScene() {

      ctx2.fill();
      ctx2.beginPath();

      ctx2.fillStyle = "#d5a878";
      ctx2.fill();

      ctx2.lineTo(21, -9);

      ctx2.fill();
      ctx2.beginPath();

      ctx2.fillStyle = "#c18c5e";
      ctx2.fill();
      ctx2.beginPath();

      ctx2.fill();
      ctx2.beginPath();

    function crest() {

      if (level >= 8) for (let i = 0; i < 30; i++) circle(i * 79.13 % 1e3 / 1e3 * w, i * 137.3 % 1e3 / 1e3 * h * 0.65, 0.6 + i % 3 * 0.3, `rgba(217,224,255,${0.2 + 0.35 * (Math.sin(clock + i) + 1) / 2})`);

        rotation += reduced ? 0 : dt * 0.35 * style.rotation;
        if (reduced) bursts = [];
        ctx2.save();
        ctx2.fillStyle = "#050a13";
        ctx2.fillRect(0, 0, w, h);
        aurora();
        atmosphere();
        ground();
        orbits(false);
        reindeer(false);
        tree();
        ribbon();
        ornaments();
        orbits(true);
        crest();
        reindeer(true);
        village();
        for (const p of bursts) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt * 1.7;
          if (p.life > 0) circle(p.x, p.y, p.size, `rgba(255,224,157,${p.life})`);
        }
        bursts = bursts.filter((p) => p.life > 0);
        ctx2.restore();
      },
      burst(x, y) {
        if (reduced) return;
        for (let i = 0; i < 18; i++) {
          const a = Math.random() * Math.PI * 2, s = 25 + Math.random() * 85;
          bursts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, size: 1 + Math.random() * 1.5 });
        }
        bursts = bursts.slice(-360);
      },
      clearBursts() {
        bursts = [];
      }
    };
  }

  // <stdin>
  var levels = [1, 5, 10];
  var times = [1.25, 3.5, 6, 9];
  function render(level, seconds, scale = 4) {
    const canvas = document.createElement("canvas");
    canvas.width = 320 * scale;
    canvas.height = 440 * scale;
    const ctx2 = canvas.getContext("2d");
    ctx2.scale(scale, scale);
    const scene = createParticleScene();
    scene.paint(ctx2, 320, 440, seconds, seconds, level, {}, level, false);
    return canvas;
  }
  window.exportTree = (level, seconds) => render(level, seconds).toDataURL("image/png");
  var sheet = document.createElement("canvas");
  sheet.width = 960;
  sheet.height = 484 * times.length;
  var ctx = sheet.getContext("2d");
  ctx.fillStyle = "#101923";
  ctx.fillRect(0, 0, sheet.width, sheet.height);
  for (let row = 0; row < times.length; row++) for (let col = 0; col < levels.length; col++) {
    const level = levels[col], time = times[row];
    ctx.drawImage(render(level, time, 1), col * 320, row * 484);
    ctx.fillStyle = "#edcf97";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Lv." + level + " \xB7 " + TREE_DESIGNS[level - 1].name + " \xB7 " + time + "s", col * 320 + 160, row * 484 + 465);
  }
  document.body.append(sheet);
  window.contactSheet = sheet.toDataURL("image/png");
  window.captureReady = true;
})();
</script></body></html>
